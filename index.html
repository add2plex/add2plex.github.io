<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Windows with URL Input</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Set-Cookie" content="SameSite=None; Secure">
<meta name="referrer" content="no-referrer-when-downgrade">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #0b132b;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Clock */
.clock {
    position: fixed;
    top: 24px;
    right: 24px;
    font-size: 48px;
    font-weight: bold;
    color: #ffffff;
    font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    z-index: 1000;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    user-select: none;
    touch-action: none;
    cursor: grab;
    transition: transform 0.1s ease-out;
    display: none;
    flex-direction: column;
    align-items: flex-end;
}

.clock-time {
    line-height: 1;
}

.clock-date {
    font-size: 0.3em;
    margin-top: 4px;
    opacity: 0.95;
}

/* Window */
.window {
    position: absolute;
    width: 500px;
    height: 500px;
    background: #000;
    border-radius: 12px;
    border: 1px solid #2d3c66;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    touch-action: none;
    overflow: hidden;
}

.window.no-input-bar .iframe-wrap {
    border-radius: 12px;
}

.window.split-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 48px 1fr;
}

.window.split-view .input-bar {
    grid-column: 1 / -1;
}

.window.split-view .iframe-wrap {
    border-right: 1px solid #2d3c66;
}

.window.split-view .auth-iframe-wrap {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Grab bar for windows without input bar */
.grab-bar {
    height: 24px;
    background: #0f1320;
    border-bottom: 1px solid #2d3c66;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 0 8px;
}

.grab-bar:active {
    cursor: grabbing;
}

.grab-bar::before {
    content: '⋮⋮';
    color: #8fb4ff;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.5;
}

/* Input bar */
.input-bar {
    height: 48px;
    display: flex;
    padding: 6px;
    gap: 6px;
    background: #1a1f2e;
    border-bottom: 1px solid #2d3c66;
    align-items: center;
}

.close-btn {
    width: 32px;
    height: 32px;
    border-radius: 16px;
    border: none;
    background: #2d3c66;
    color: #ff6b6b;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.refresh-btn {
    width: 32px;
    height: 32px;
    border-radius: 16px;
    border: none;
    background: #2d3c66;
    color: #8fb4ff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.new-tab-btn {
    width: 32px;
    height: 32px;
    border-radius: 16px;
    border: none;
    background: #2d3c66;
    color: #8fb4ff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: auto;
}

.input-bar input {
    flex: 1;
    height: 32px;
    border-radius: 16px;
    border: none;
    padding: 0 12px;
    font-size: 14px;
    background: #0f1320;
    color: #fff;
    outline: none;
}

.input-bar button {
    height: 32px;
    padding: 0 14px;
    border-radius: 16px;
    border: none;
    background: #2d3c66;
    color: #8fb4ff;
    font-size: 14px;
    cursor: pointer;
}

/* Iframe container */
.iframe-wrap {
    flex: 1;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Auth popup overlay */
.auth-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(11, 19, 43, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.auth-overlay.active {
    display: flex;
}

.auth-message {
    color: #8fb4ff;
    font-size: 14px;
    text-align: center;
}

.auth-iframe-wrap {
    display: none;
    flex-direction: column;
}

.auth-iframe-wrap.active {
    display: flex;
}

.auth-header {
    height: 36px;
    background: #1a1f2e;
    border-bottom: 1px solid #2d3c66;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    color: #8fb4ff;
    font-size: 12px;
}

.auth-close-btn {
    width: 24px;
    height: 24px;
    border-radius: 12px;
    border: none;
    background: #2d3c66;
    color: #ff6b6b;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.auth-iframe-wrap iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
}

/* Resize handle */
.resize {
    position: absolute;
    width: 25px;
    height: 25px;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, transparent 50%, #8fb4ff 50%);
    cursor: nwse-resize;
    touch-action: none;
    border-radius: 0 0 12px 0;
}

/* Weather Station Widget (Combined Clock, Weather, Forecast) */
.weather-station-widget {
    position: absolute;
    width: 500px;
    height: 600px;
    background: #1a1f2e;
    border-radius: 12px;
    border: 1px solid #2d3c66;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    touch-action: none;
    overflow: hidden;
    container-type: size;
    container-name: weatherstation;
}

.weather-station-grab-bar {
    height: 24px;
    background: #0f1320;
    border-bottom: 1px solid #2d3c66;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 0 8px;
}

.weather-station-grab-bar:active {
    cursor: grabbing;
}

.weather-station-grab-bar::before {
    content: '⋮⋮';
    color: #8fb4ff;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.5;
}

.widget-name {
    font-size: 11px;
    color: #8fb4ff;
    font-weight: 600;
    opacity: 0.8;
    letter-spacing: 0.5px;
}

.weather-station-content {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
}

/* Clock Section */
.ws-clock-section {
    text-align: center;
    padding: 8px 0;
    border-bottom: 1px solid #2d3c66;
    flex-shrink: 0;
}

.ws-clock-time {
    font-size: clamp(32px, 12cqw, 72px);
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
}

.ws-clock-date {
    font-size: clamp(12px, 4cqw, 20px);
    color: #8fb4ff;
    opacity: 0.9;
    margin-top: 4px;
}

/* 3-Day Forecast Section */
.ws-forecast-section {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #2d3c66;
}

.ws-forecast-day {
    flex: 1;
    background: #0f1320;
    border-radius: 8px;
    border: 1px solid #2d3c66;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.ws-forecast-label {
    font-size: clamp(11px, 3.5cqw, 16px);
    font-weight: bold;
    color: #8fb4ff;
}

.ws-forecast-icon {
    font-size: clamp(24px, 8cqw, 48px);
    animation: float 3s ease-in-out infinite;
    line-height: 1;
}

.ws-forecast-temps {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.ws-forecast-high {
    font-size: clamp(14px, 4.5cqw, 22px);
    font-weight: bold;
    color: #ff8080;
}

.ws-forecast-low {
    font-size: clamp(12px, 4cqw, 18px);
    font-weight: bold;
    color: #80b3ff;
}

.ws-forecast-precip {
    font-size: clamp(10px, 3cqw, 14px);
    color: #8fb4ff;
    display: flex;
    align-items: center;
    gap: 2px;
}

.ws-forecast-precip::before {
    content: '💧';
    font-size: clamp(8px, 2.5cqw, 12px);
}

/* Current Weather Section */
.ws-current-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid #2d3c66;
    flex-shrink: 0;
}

.ws-current-icon {
    font-size: clamp(48px, 16cqw, 96px);
    animation: float 3s ease-in-out infinite;
    line-height: 1;
}

.ws-current-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}

.ws-current-temp {
    font-size: clamp(36px, 12cqw, 72px);
    font-weight: bold;
    color: #8fb4ff;
    line-height: 1;
}

.ws-current-description {
    font-size: clamp(14px, 4.5cqw, 22px);
    color: #ffffff;
    text-transform: capitalize;
}

.ws-current-details {
    display: flex;
    gap: 16px;
    margin-top: 4px;
}

.ws-current-detail {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.ws-current-detail-label {
    font-size: clamp(9px, 3cqw, 12px);
    color: #8fb4ff;
    opacity: 0.7;
    text-transform: uppercase;
}

.ws-current-detail-value {
    font-size: clamp(14px, 4.5cqw, 20px);
    color: #ffffff;
    font-weight: bold;
}

/* 6-Hour Forecast Section */
.ws-hourly-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}

.ws-hourly-title {
    font-size: clamp(10px, 3cqw, 14px);
    color: #8fb4ff;
    text-transform: uppercase;
    margin-bottom: 6px;
    flex-shrink: 0;
}

.ws-hourly-container {
    flex: 1;
    display: flex;
    gap: 4px;
    overflow: hidden;
    padding-bottom: 4px;
}

.ws-hourly-item {
    flex: 1;
    min-width: 0;
    background: #0f1320;
    border-radius: 6px;
    border: 1px solid #2d3c66;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.ws-hourly-time {
    font-size: clamp(9px, 2.5cqw, 12px);
    color: #8fb4ff;
    font-weight: 500;
}

.ws-hourly-icon {
    font-size: clamp(18px, 5cqw, 28px);
    line-height: 1;
}

.ws-hourly-temp {
    font-size: clamp(12px, 3.5cqw, 16px);
    font-weight: bold;
    color: #ffffff;
}

.ws-hourly-precip {
    font-size: clamp(8px, 2.5cqw, 11px);
    color: #8fb4ff;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

<body>

<button class="padlock-btn" id="padlockBtn">🔓</button>

<div class="cursor-circle" id="cursorCircle"></div>

<div class="clock" id="clock"></div>

<div class="weather-station-widget" id="weatherStationWidget">
    <div class="weather-station-grab-bar">
        <span class="widget-name">Weather Station</span>
    </div>
    <div class="weather-station-content">
        <!-- Clock Section -->
        <div class="ws-clock-section">
            <div class="ws-clock-time" id="wsClockTime">--:-- --</div>
            <div class="ws-clock-date" id="wsClockDate">Loading...</div>
        </div>
        
        <!-- 3-Day Forecast -->
        <div class="ws-forecast-section" id="wsForecastSection">
            <div class="ws-forecast-day">
                <div class="ws-forecast-label">Today</div>
                <div class="ws-forecast-icon">☀️</div>
                <div class="ws-forecast-temps">

<script>
// Enable third-party cookies and credentials globally
document.cookie = "cookiesEnabled=true; SameSite=None; Secure";

let zIndex = 1;
let isLocked = false;
let clockScale = 1;
let initialDistance = 0;
let initialScale = 1;
let isDraggingClock = false;
let clockStartX = 0;
let clockStartY = 0;
let clockOffsetX = 0;
let clockOffsetY = 0;

// Update clock for Weather Station
function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    
    hours = hours % 12;
    hours = hours ? hours : 12;
    const minutesStr = minutes < 10 ? '0' + minutes : minutes;
    
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    
    const dayName = days[now.getDay()];
    const monthName = months[now.getMonth()];
    const date = now.getDate();
    const year = now.getFullYear();
    
    // Update Weather Station clock
    const wsClockTime = document.getElementById('wsClockTime');
    const wsClockDate = document.getElementById('wsClockDate');
    if (wsClockTime && wsClockDate) {
        wsClockTime.textContent = `${hours}:${minutesStr} ${ampm}`;
        wsClockDate.textContent = `${dayName}, ${monthName} ${date}, ${year}`;
    }
}

updateClock();
setInterval(updateClock, 1000);

const clockEl = document.getElementById('clock');

function getDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function isTouchingClock(touches) {
    const rect = clockEl.getBoundingClientRect();
    for (let touch of touches) {
        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
            return true;
        }
    }
    return false;
}

clockEl.addEventListener('pointerdown', (e) => {
    isDraggingClock = true;
    clockEl.setPointerCapture(e.pointerId);
    const rect = clockEl.getBoundingClientRect();
    clockStartX = e.clientX - rect.left;
    clockStartY = e.clientY - rect.top;
    clockEl.style.cursor = 'grabbing';
});

clockEl.addEventListener('pointermove', (e) => {
    if (isDraggingClock) {
        e.preventDefault();
        clockOffsetX = e.clientX - clockStartX;
        clockOffsetY = e.clientY - clockStartY;
        clockEl.style.left = clockOffsetX + 'px';
        clockEl.style.top = clockOffsetY + 'px';
        clockEl.style.right = 'auto';
        const screenWidth = window.innerWidth;
        const centerX = screenWidth / 2;
        const clockCenterX = clockOffsetX + (clockEl.offsetWidth / 2);
        if (Math.abs(clockCenterX - centerX) <= 20) {
            clockEl.style.alignItems = 'center';
        } else if (clockCenterX < centerX) {
            clockEl.style.alignItems = 'flex-start';
        } else {
            clockEl.style.alignItems = 'flex-end';
        }
    }
});

clockEl.addEventListener('pointerup', () => {
    isDraggingClock = false;
    clockEl.style.cursor = 'grab';
});

clockEl.addEventListener('pointercancel', () => {
    isDraggingClock = false;
    clockEl.style.cursor = 'grab';
});

clockEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        isDraggingClock = false;
        initialDistance = getDistance(e.touches);
        initialScale = clockScale;
    }
});

clockEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && isTouchingClock(e.touches)) {
        e.preventDefault();
        const currentDistance = getDistance(e.touches);
        clockScale = initialScale * (currentDistance / initialDistance);
        clockScale = Math.max(0.5, Math.min(clockScale, 3));
        clockEl.style.transform = `scale(${clockScale})`;
        clockEl.style.transformOrigin = 'top left';
    }
});

clockEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    clockScale += delta;
    clockScale = Math.max(0.5, Math.min(clockScale, 3));
    clockEl.style.transform = `scale(${clockScale})`;
    clockEl.style.transformOrigin = 'top left';
});

async function fetchWeatherStation() {
    try {
        const lat = 30.1588;
        const lon = -85.6602;
        
        // Fetch current weather, daily forecast, and hourly forecast
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&hourly=temperature_2m,weather_code,precipitation_probability&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=3`);
        const data = await response.json();
        
        const localNow = new Date();
        const currentHour = localNow.getHours();
        const currentMin = localNow.getMinutes();
        const today = localNow.toISOString().split('T')[0];
        const dailyIndex = data.daily.time.indexOf(today);
        
        // Determine if it's night time
        let isNightTime = false;
        if (dailyIndex >= 0 && data.daily.sunrise && data.daily.sunset) {
            const sunriseStr = data.daily.sunrise[dailyIndex];
            const sunsetStr = data.daily.sunset[dailyIndex];
            const sunriseHourMin = sunriseStr.substring(11, 16);
            const sunsetHourMin = sunsetStr.substring(11, 16);
            const currentHourMin = currentHour.toString().padStart(2, '0') + ':' + currentMin.toString().padStart(2, '0');
            isNightTime = currentHourMin > sunsetHourMin || currentHourMin < sunriseHourMin;
        }
        
        // Update current weather
        const temp = Math.round(data.current.temperature_2m);
        const humidity = data.current.relative_humidity_2m;
        const precipProb = data.current.precipitation_probability || 0;
        const weatherCode = data.current.weather_code;
        const weatherInfo = getWeatherInfo(weatherCode);
        let finalIcon = weatherInfo.icon;
        if (isNightTime && weatherCode <= 3) {
            finalIcon = '🌙';
        }
        
        document.getElementById('wsCurrentTemp').textContent = `${temp}°F`;
        document.getElementById('wsCurrentIcon').textContent = finalIcon;
        document.getElementById('wsCurrentDesc').textContent = weatherInfo.description;
        document.getElementById('wsHumidity').textContent = `${humidity}%`;
        document.getElementById('wsPrecip').textContent = `${precipProb}%`;
        
        // Update 3-day forecast
        const forecastDays = document.querySelectorAll('.ws-forecast-day');
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        
        forecastDays.forEach((dayEl, index) => {
            const date = new Date(localNow);
            date.setDate(localNow.getDate() + index);
            const label = index === 0 ? 'Today' : dayNames[date.getDay()];
            const high = Math.round(data.daily.temperature_2m_max[index]);
            const low = Math.round(data.daily.temperature_2m_min[index]);
            const precip = data.daily.precipitation_probability_max[index] || 0;
            const dayWeatherCode = data.daily.weather_code[index];
            const dayWeatherInfo = getWeatherInfo(dayWeatherCode);
            
            dayEl.querySelector('.ws-forecast-label').textContent = label;
            dayEl.querySelector('.ws-forecast-icon').textContent = dayWeatherInfo.icon;
            dayEl.querySelector('.ws-forecast-high').textContent = `${high}°`;
            dayEl.querySelector('.ws-forecast-low').textContent = `${low}°`;
            dayEl.querySelector('.ws-forecast-precip').textContent = `${precip}%`;
        });
        
        // Update 10-hour forecast
        const hourlyContainer = document.getElementById('wsHourlyContainer');
        hourlyContainer.innerHTML = '';
        
        // Find the current hour index in the hourly data
        const currentDateTime = localNow.toISOString().slice(0, 13) + ':00';
        let startIndex = data.hourly.time.findIndex(t => t >= currentDateTime);
        if (startIndex === -1) startIndex = 0;
        
        for (let i = 0; i < 6; i++) {
            const hourIndex = startIndex + i;
            if (hourIndex >= data.hourly.time.length) break;
            
            const hourTime = new Date(data.hourly.time[hourIndex]);
            let hourLabel = hourTime.getHours();
            const ampm = hourLabel >= 12 ? 'PM' : 'AM';
            hourLabel = hourLabel % 12;
            hourLabel = hourLabel ? hourLabel : 12;
            
            const hourTemp = Math.round(data.hourly.temperature_2m[hourIndex]);
            const hourWeatherCode = data.hourly.weather_code[hourIndex];
            const hourPrecip = data.hourly.precipitation_probability[hourIndex] || 0;
            const hourWeatherInfo = getWeatherInfo(hourWeatherCode);
            
            // Check if this hour is night time
            let hourIcon = hourWeatherInfo.icon;
            const hourNum = hourTime.getHours();
            if (data.daily.sunrise && data.daily.sunset) {
                const dayIdx = data.daily.time.indexOf(hourTime.toISOString().split('T')[0]);
                if (dayIdx >= 0) {
                    const sunriseHour = parseInt(data.daily.sunrise[dayIdx].substring(11, 13));
                    const sunsetHour = parseInt(data.daily.sunset[dayIdx].substring(11, 13));
                    if ((hourNum >= sunsetHour || hourNum < sunriseHour) && hourWeatherCode <= 3) {
                        hourIcon = '🌙';
                    }
                }
            }
            
            const hourItem = document.createElement('div');
            hourItem.className = 'ws-hourly-item';
            hourItem.innerHTML = `
                <div class="ws-hourly-time">${hourLabel}${ampm}</div>
                <div class="ws-hourly-icon">${hourIcon}</div>
                <div class="ws-hourly-temp">${hourTemp}°</div>
                <div class="ws-hourly-precip">💧${hourPrecip}%</div>
            `;
            hourlyContainer.appendChild(hourItem);
        }
        
    } catch (error) {
        console.error('Error fetching weather station data:', error);
        document.getElementById('wsCurrentDesc').textContent = 'Unable to load weather';
    }
}

let pupPicsIntervalId = null;
let pupPicsObserver = null;
let nextPupPicsUrl = null;
let isLoadingNextImage = false;
let preloadRetryId = null;

// Multiple dog image API sources
const dogApiSources = [
    {
        name: 'random.dog',
        fetch: async () => {
            const response = await fetch('https://random.dog/woof.json');
            const data = await response.json();
            if (data && data.url) {
                const url = data.url.toLowerCase();
                if (url.endsWith('.mp4') || url.endsWith('.webm') || url.endsWith('.gif')) {
                    return null; // Skip videos and gifs
                }
                return data.url;
            }
            return null;
        }
    },
    {
        name: 'dog.ceo',
        fetch: async () => {
            const response = await fetch('https://dog.ceo/api/breeds/image/random');
            const data = await response.json();
            if (data && data.status === 'success' && data.message) {
                return data.message;
            }
            return null;
        }
    },
    {
        name: 'thedogapi',
        fetch: async () => {
            const response = await fetch('https://api.thedogapi.com/v1/images/search?size=med&mime_types=jpg,png');
            const data = await response.json();
            if (data && data.length > 0 && data[0].url) {
                return data[0].url;
            }
            return null;
        }
    },
    {
        name: 'shibe.online',
        fetch: async () => {
            const response = await fetch('https://shibe.online/api/shibes?count=1&urls=true');
            const data = await response.json();
            if (data && data.length > 0) {
                return data[0];
            }
            return null;
        }
    },
    {
        name: 'place.dog',
        fetch: async () => {
            // Generate random dimensions for variety
            const width = 400 + Math.floor(Math.random() * 200);
            const height = 400 + Math.floor(Math.random() * 200);
            return `https://place.dog/${width}/${height}?random=${Date.now()}`;
        }
    }
];

let lastDogSourceIndex = -1;

async function getRandomDogImage() {
    // Rotate through sources to ensure variety
    let attempts = 0;
    while (attempts < dogApiSources.length * 2) {
        // Pick a different source than last time if possible
        let sourceIndex;
        do {
            sourceIndex = Math.floor(Math.random() * dogApiSources.length);
        } while (sourceIndex === lastDogSourceIndex && dogApiSources.length > 1 && attempts < dogApiSources.length);
        
        lastDogSourceIndex = sourceIndex;
        const source = dogApiSources[sourceIndex];
        
        try {
            const url = await source.fetch();
            if (url) {
                console.log(`Dog pic from: ${source.name}`);
                return url;
            }
        } catch (error) {
            console.error(`Error fetching from ${source.name}:`, error);
        }
        attempts++;
    }
    return null;
}

async function preloadNextImage() {
    if (isLoadingNextImage) return;
    isLoadingNextImage = true;
    
    try {
        const imageUrl = await getRandomDogImage();
        if (imageUrl) {
            nextPupPicsUrl = imageUrl;
        }
    } catch (error) {
        console.error('Error preloading dog pic:', error);
    } finally {
        isLoadingNextImage = false;
    }
}

function displayNextImage() {
    if (preloadRetryId) {
        clearTimeout(preloadRetryId);
        preloadRetryId = null;
    }
    if (nextPupPicsUrl) {
        const img = document.getElementById('pupPicsImage');
        const imageUrl = nextPupPicsUrl;
        nextPupPicsUrl = null;
        img.style.transition = 'opacity 1s ease-in-out';
        img.style.opacity = '0';
        setTimeout(() => {
            img.src = imageUrl;
            img.alt = 'Cute dog picture';
            img.style.opacity = '1';
            preloadNextImage();
            pupPicsIntervalId = setTimeout(displayNextImage, 20000);
        }, 1000);
    } else {
        loadNextPupPic();
    }
}

async function loadNextPupPic() {
    if (pupPicsIntervalId) {
        clearTimeout(pupPicsIntervalId);
    }
    if (preloadRetryId) {
        clearTimeout(preloadRetryId);
        preloadRetryId = null;
    }
    
    try {
        const imageUrl = await getRandomDogImage();
        if (imageUrl) {
            const img = document.getElementById('pupPicsImage');
            img.style.transition = 'opacity 1s ease-in-out';
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = imageUrl;
                img.alt = 'Cute dog picture';
                img.style.opacity = '1';
                preloadNextImage();
                pupPicsIntervalId = setTimeout(displayNextImage, 20000);
            }, 1000);
        } else {
            // Retry after 2 seconds if no image found
            pupPicsIntervalId = setTimeout(loadNextPupPic, 2000);
        }
    } catch (error) {
        console.error('Error loading dog pic:', error);
        pupPicsIntervalId = setTimeout(loadNextPupPic, 2000);
    }
}

function saveWidgetLayout() {
    const layout = {};
    const widgets = [
        { id: 'weatherStationWidget', type: 'standard' },
        { id: 'radarWin', type: 'window' },
        { id: 'camsWidget', type: 'standard' },
        { id: 'internetSpeedWidget', type: 'standard' },
        { id: 'pupPicsWidget', type: 'standard' },
        { id: 'lightsWidget', type: 'standard' },
        { id: 'overseerrWidget', type: 'standard' }
    ];
    widgets.forEach(widget => {
        const el = document.getElementById(widget.id);
        if (el) {
            layout[widget.id] = {
                left: el.style.left,
                top: el.style.top,
                width: el.style.width,
                height: el.style.height,
                zIndex: el.style.zIndex
            };
        }
    });
    localStorage.setItem('widgetLayout', JSON.stringify(layout));
    localStorage.setItem('widgetLayoutLocked', 'true');
    console.log('Widget layout saved to localStorage');
}

function loadWidgetLayout() {
    const savedLayout = localStorage.getItem('widgetLayout');
    const isLocked = localStorage.getItem('widgetLayoutLocked') === 'true';
    
    if (!savedLayout || !isLocked) return false;
    
    try {
        const layout = JSON.parse(savedLayout);
        Object.keys(layout).forEach(widgetId => {
            const el = document.getElementById(widgetId);
            if (el && layout[widgetId]) {
                if (layout[widgetId].left) el.style.left = layout[widgetId].left;
                if (layout[widgetId].top) el.style.top = layout[widgetId].top;
                if (layout[widgetId].width) el.style.width = layout[widgetId].width;
                if (layout[widgetId].height) el.style.height = layout[widgetId].height;
                if (layout[widgetId].zIndex) el.style.zIndex = layout[widgetId].zIndex;
            }
        });
        console.log('Widget layout restored from localStorage');
        return true;
    } catch (error) {
        console.error('Error loading widget layout:', error);
        return false;
    }
}

function clearWidgetLayout() {
    localStorage.removeItem('widgetLayoutLocked');
    console.log('Widget layout unlocked');
}

        weatherStationWidget.style.top = padding + "px";
        weatherStationWidget.style.width = (widgetWidth * 1.5) + "px";
        weatherStationWidget.style.height = (widgetHeight * 1.8) + "px";

    weatherStationWidget.style.zIndex = ++zIndex;
    enableDrag(weatherStationWidget, weatherStationWidget.querySelector('.weather-station-grab-bar'));
    enableResize(weatherStationWidget, weatherStationWidget.querySelector('.weather-station-resize'));

    leftPosition += (widgetWidth * 1.5) + padding;
    
    const radarWin = document.createElement("div");
    radarWin.className = "window no-input-bar";

        <div class="grab-bar">
            <span class="widget-name">Radar</span>
        </div>
        <div class="iframe-wrap" style="overflow:hidden;">
            <iframe id="radarIframe" allow="autoplay; fullscreen; picture-in-picture; popups; same-origin; scripts; forms; encrypted-media; microphone; camera" 
                    credentials="include" 
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen
                    src="http://localhost:3000"></iframe>
        </div>
        <div class="resize"></div>
    `;
    document.body.appendChild(radarWin);
    
    if (!hasSavedLayout) {
        radarWin.style.left = leftPosition + "px";
        radarWin.style.top = padding + "px";

        radarWin.style.height = widgetHeight + "px";

    enableDrag(radarWin);
    enableResize(radarWin);
    
    leftPosition += widgetWidth + padding;
    
    const camsWidget = document.getElementById('camsWidget');
    if (!hasSavedLayout) {
        camsWidget.style.left = leftPosition + "px";
        camsWidget.style.top = padding + "px";
        camsWidget.style.width = widgetWidth + "px";
        camsWidget.style.height = widgetHeight + "px";
    }
    camsWidget.style.zIndex = ++zIndex;
    enableDrag(camsWidget, camsWidget.querySelector('.cams-grab-bar'));
    enableResize(camsWidget, camsWidget.querySelector('.cams-resize'));
    leftPosition += widgetWidth + padding;
    

    
    const internetSpeedWidget = document.getElementById('internetSpeedWidget');
    if (!hasSavedLayout) {
        internetSpeedWidget.style.left = leftPosition + "px";
        internetSpeedWidget.style.top = padding + "px";
        internetSpeedWidget.style.width = widgetWidth + "px";
        internetSpeedWidget.style.height = widgetHeight + "px";
    }
    internetSpeedWidget.style.zIndex = ++zIndex;
    enableDrag(internetSpeedWidget, internetSpeedWidget.querySelector('.internet-speed-grab-bar'));
    enableResize(internetSpeedWidget, internetSpeedWidget.querySelector('.internet-speed-resize'));
    leftPosition += widgetWidth + padding;
    
    const pupPicsWidget = document.getElementById('pupPicsWidget');
    if (!hasSavedLayout) {
        pupPicsWidget.style.left = leftPosition + "px";
        pupPicsWidget.style.top = padding + "px";
        pupPicsWidget.style.width = widgetWidth + "px";
        pupPicsWidget.style.height = widgetHeight + "px";
    }
    pupPicsWidget.style.zIndex = ++zIndex;
    enableDrag(pupPicsWidget, pupPicsWidget.querySelector('.pup-pics-grab-bar'));
    enableResize(pupPicsWidget, pupPicsWidget.querySelector('.pup-pics-resize'));
    initPupPics();
    leftPosition += widgetWidth + padding;
    
    const lightsWidget = document.getElementById('lightsWidget');

        lightsWidget.style.left = leftPosition + "px";

        lightsWidget.style.width = widgetWidth + "px";
        lightsWidget.style.height = widgetHeight + "px";
    }

    const overseerrWidget = document.getElementById('overseerrWidget');

        overseerrWidget.style.height = widgetHeight + "px";
    }

    enableResize(overseerrWidget, overseerrWidget.querySelector('.overseerr-resize'));
    
    // Now restore saved layout if it exists (after all widgets are created)
    if (hasSavedLayout) {
        loadWidgetLayout();
    }
    
    const padlockBtn = document.getElementById('padlockBtn');
    padlockBtn.addEventListener('click', () => {
        isLocked = !isLocked;
        padlockBtn.textContent = isLocked ? '🔒' : '🔓';
        if (isLocked) {

        } else {

});

function createWindow() {
    const win = document.createElement("div");
    win.className = "window";
    win.style.left = "40px";
    win.style.top = "40px";
    win.style.zIndex = ++zIndex;
    win.innerHTML = `
        <div class="input-bar">
            <button class="close-btn">×</button>
            <button class="refresh-btn">↻</button>
            <input type="text" placeholder="Enter URL or search term">
            <button>Go</button>
            <button class="new-tab-btn">↗</button>
        </div>
        <div class="iframe-wrap">
            <iframe allow="autoplay; fullscreen; picture-in-picture; popups; same-origin; scripts; forms; encrypted-media; microphone; camera" 
                    credentials="include" 
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen
                    src=""></iframe>
        </div>
        <div class="auth-iframe-wrap">
            <div class="auth-header">
                <span>Login</span>
                <button class="auth-close-btn">×</button>
            </div>
            <iframe allow="autoplay; fullscreen; picture-in-picture; popups; same-origin; scripts; forms; encrypted-media; microphone; camera" 
                    credentials="include" 
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen
                    src=""></iframe>
        </div>
        <div class="auth-overlay">
            <div class="auth-message">Waiting for authentication...</div>
        </div>
        <div class="resize"></div>
    `;
    document.body.appendChild(win);
    bringToFront(win);
    enableDrag(win);
    enableResize(win);
    enableInput(win);
    enableClose(win);
    enableRefresh(win);
    enableNewTab(win);
    enableAuth(win);
}

function enableInput(win) {
    const input = win.querySelector(".input-bar input");
    const goButton = win.querySelector(".input-bar button:last-of-type");
    const iframe = win.querySelector("iframe");
    function navigate(e) {
        if (e) e.stopPropagation();
        let value = input.value.trim();
        if (!value) return;
        let url;
        if (/^https?:\/\//i.test(value)) {
            url = value;
        } else if (value.startsWith("localhost") || value.startsWith("127.0.0.1") || /^localhost:/i.test(value) || /^127\.0\.0\.1:/i.test(value)) {
            url = "http://" + value;
        } else if (/^192\.168\.\d{1,3}\.\d{1,3}(:\d+)?$/.test(value) || /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}(:\d+)?$/.test(value) || /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}(:\d+)?$/.test(value)) {
            url = "http://" + value;
        } else if (value.includes(".") && !value.includes(" ")) {
            url = "https://" + value;
        } else {
            url = "https://www.google.com/search?q=" + encodeURIComponent(value);
        }
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; popups; same-origin; scripts; forms; encrypted-media; microphone; camera');
        iframe.setAttribute('credentials', 'include');
        iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        iframe.setAttribute('allowfullscreen', '');
        iframe.src = url;
    }
    goButton.addEventListener("click", navigate);
    goButton.addEventListener("touchend", navigate);
    input.addEventListener("keydown", e => { if(e.key === "Enter") navigate(); });
}

function bringToFront(win) {
    win.style.zIndex = ++zIndex;
}

function enableClose(win) {
    const closeBtn = win.querySelector(".close-btn");
    closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        win.remove();
    });
}

function enableRefresh(win) {
    const refreshBtn = win.querySelector(".refresh-btn");
    const iframe = win.querySelector("iframe");
    refreshBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (iframe.src) {
            iframe.src = iframe.src;
        }
    });
}

function enableNewTab(win) {
    const newTabBtn = win.querySelector(".new-tab-btn");
    const iframe = win.querySelector("iframe");
    newTabBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (iframe.src) {
            window.open(iframe.src, "_blank");
        }
    });
}

function enableAuth(win) {
    const iframe = win.querySelector(".iframe-wrap iframe");
    const authIframeWrap = win.querySelector(".auth-iframe-wrap");
    const authIframe = win.querySelector(".auth-iframe-wrap iframe");
    const authCloseBtn = win.querySelector(".auth-close-btn");
    const overlay = win.querySelector(".auth-overlay");
    authCloseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        win.classList.remove("split-view");
        authIframeWrap.classList.remove("active");
        authIframe.src = "";
    });
    window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "auth-success") {
            win.classList.remove("split-view");
            authIframeWrap.classList.remove("active");
            overlay.classList.remove("active");
            authIframe.src = "";
            win.authToken = event.data.token;
            if (iframe.src) {
                iframe.src = iframe.src;
            }
        }
    });
}

function enableDrag(win, dragTarget) {
    if (!dragTarget) {
        const bar = win.querySelector(".input-bar");
        const grabBar = win.querySelector(".grab-bar");
        dragTarget = bar || grabBar || win;
    }
    dragTarget.onpointerdown = e => {
        if (isLocked) return;
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || 
            e.target.tagName === 'IFRAME' || e.target.classList.contains('resize') ||
            e.target.classList.contains('weather-resize')) return;
        bringToFront(win);
        dragTarget.setPointerCapture(e.pointerId);
        const sx = e.clientX;
        const sy = e.clientY;
        const sl = win.offsetLeft;
        const st = win.offsetTop;
        const move = ev => {
            const newLeft = sl + (ev.clientX - sx);
            const newTop = st + (ev.clientY - sy);
            win.style.left = newLeft + "px";
            win.style.top = Math.max(0, newTop) + "px";
        };
        const up = () => dragTarget.onpointermove = null;
        dragTarget.onpointermove = move;
        dragTarget.onpointerup = up;
    };
}

function enableResize(win, handle) {
    if (!handle) {
        handle = win.querySelector(".resize");
    }
    handle.onpointerdown = e => {
        if (isLocked) return;
        bringToFront(win);
        handle.setPointerCapture(e.pointerId);
        const sx = e.clientX;
        const sy = e.clientY;
        const sw = win.offsetWidth;
        const sh = win.offsetHeight;
        const move = ev => {
            const isForecast = win.classList.contains('forecast-widget');
            const minWidth = isForecast ? 400 : 250;
            const minHeight = isForecast ? 140 : 200;
            win.style.width  = Math.max(minWidth, sw + (ev.clientX - sx)) + "px";
            win.style.height = Math.max(minHeight, sh + (ev.clientY - sy)) + "px";
        };
        const up = () => handle.onpointermove = null;
        handle.onpointermove = move;
        handle.onpointerup = up;
    };
}
